<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Maintenance - JubayerXtools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --primary: #24C7F2;
            --primary-glow: rgba(36, 199, 242, 0.25);
            --primary-border: rgba(36, 199, 242, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 40px;
        }
        .maintenance-container {
            background: #141b2d;
            border: 1px solid var(--primary-border);
            border-radius: 24px;
            padding: 60px 50px;
            max-width: 550px; width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .maintenance-icon { font-size: 4rem; color: var(--primary); margin-bottom: 20px; }
        .maintenance-icon i { animation: spin 3s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .maintenance-title {
            font-size: 2.5rem; font-weight: 900; margin-bottom: 12px;
            color: var(--primary);
            text-shadow: 0 0 40px var(--primary-glow);
        }

        .maintenance-image {
            width: 100%; max-height: 200px; object-fit: cover;
            border-radius: 14px; margin-bottom: 25px;
        }

        .maintenance-message {
            font-size: 1.05rem; color: #94a3b8;
            line-height: 1.8; margin-bottom: 30px;
        }

        .status-indicator {
            display: inline-flex; align-items: center; gap: 12px;
            padding: 10px 24px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--primary-border);
            border-radius: 50px; font-size: 0.9rem; color: #94a3b8;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ef4444; animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

        .back-home {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 32px;
            border: 1.5px solid var(--primary-border);
            border-radius: 50px;
            background: transparent;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .back-home:hover {
            border-color: var(--primary);
            color: #ffffff;
            background: var(--primary-hover);
        }

        @media (max-width: 600px) {
            .maintenance-container { padding: 40px 25px; }
            .maintenance-title { font-size: 2rem; }
            .maintenance-message { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">

        {% if maintenance and maintenance.photo %}
        <img src="{{ maintenance.photo }}" alt="Maintenance" class="maintenance-image">
        {% else %}
        <div class="maintenance-icon"><i class="fas fa-tools"></i></div>
        {% endif %}

        <h1 class="maintenance-title">Under Maintenance</h1>

        <p class="maintenance-message">
            {{ maintenance.message if maintenance else 'Site is under maintenance. Please check back later.' }}
        </p>

        <div class="status-indicator">
            <span class="status-dot"></span>
            <span>We'll be back soon</span>
        </div>

        <a href="/" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

    </div>
</body>
</html>
